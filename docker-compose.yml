# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker compose up -d
#   2. Access at http://127.0.0.1:3000
#
# Optional macOS Docker Desktop + TUN proxy mode:
#   see docs/operations/macos-docker-tun-lan.md
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and active PostgreSQL SQL_DSN entry
#   2. Uncomment the mysql service and replace SQL_DSN with a MySQL DSN
#   3. Replace the postgres dependency with the mysql dependency
#   4. Uncomment mysql_data in the volumes section
#
# Production deployments must provide explicit database and Redis credentials.
# Existing containers are not changed by this file-only hardening.

services:
  new-api:
    image: ${NEW_API_IMAGE:-new-api-local:prod-main}
    container_name: ${NEW_API_CONTAINER_NAME:-new-api}
    init: true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_PORT_MAPPING:-3000:3000}"
    volumes:
      - type: bind
        source: ${NEW_API_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ${NEW_API_LOG_DIR:-./logs}
        target: /app/logs
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET:?set CRYPTO_SECRET}
      - SQL_DSN=${SQL_DSN:?set SQL_DSN}
#      - SQL_DSN=root:<explicit-password>@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      # SQL_DSN=local 时使用 SQLite。留空则沿用代码默认值（工作目录下的 one-api.db）。
      - SQLITE_PATH=${SQLITE_PATH:-}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:?set REDIS_CONN_STRING}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true} # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}  # 是否启用批量更新 (Whether to enable batch update)
      # 全局限流阈值（仅环境变量生效，后台设置页无对应选项）
      - GLOBAL_API_RATE_LIMIT=${GLOBAL_API_RATE_LIMIT:-180}
      - GLOBAL_API_RATE_LIMIT_DURATION=${GLOBAL_API_RATE_LIMIT_DURATION:-180}
      - GLOBAL_WEB_RATE_LIMIT=${GLOBAL_WEB_RATE_LIMIT:-60}
      - GLOBAL_WEB_RATE_LIMIT_DURATION=${GLOBAL_WEB_RATE_LIMIT_DURATION:-180}
      # 仅在选项 GlobalRateLimitAdminExemptEnabled 尚不存在时播种；此后以后台开关为准
      - GLOBAL_RATE_LIMIT_ADMIN_EXEMPT=${GLOBAL_RATE_LIMIT_ADMIN_EXEMPT:-false}
      # 各限流器的总开关，false 即整条限流不挂载
      - GLOBAL_API_RATE_LIMIT_ENABLE=${GLOBAL_API_RATE_LIMIT_ENABLE:-true}
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=${GLOBAL_WEB_RATE_LIMIT_ENABLE:-true}
      - CRITICAL_RATE_LIMIT_ENABLE=${CRITICAL_RATE_LIMIT_ENABLE:-true}
      - SEARCH_RATE_LIMIT_ENABLE=${SEARCH_RATE_LIMIT_ENABLE:-true}
      - SUGGESTION_RATE_LIMIT_ENABLE=${SUGGESTION_RATE_LIMIT_ENABLE:-true}
      # 关键接口限流（登录、注册、找回密码、支付等）
      - CRITICAL_RATE_LIMIT=${CRITICAL_RATE_LIMIT:-20}
      - CRITICAL_RATE_LIMIT_DURATION=${CRITICAL_RATE_LIMIT_DURATION:-1200}
      # 搜索与联想限流，按用户 ID 分桶
      - SEARCH_RATE_LIMIT=${SEARCH_RATE_LIMIT:-10}
      - SEARCH_RATE_LIMIT_DURATION=${SEARCH_RATE_LIMIT_DURATION:-60}
      - SUGGESTION_RATE_LIMIT=${SUGGESTION_RATE_LIMIT:-60}
      - SUGGESTION_RATE_LIMIT_DURATION=${SUGGESTION_RATE_LIMIT_DURATION:-60}
      # 桌面端 OAuth 轮询限流，按 handoff_token 分桶
      - DESKTOP_OAUTH_POLL_RATE_LIMIT_ENABLE=${DESKTOP_OAUTH_POLL_RATE_LIMIT_ENABLE:-true}
      - DESKTOP_OAUTH_POLL_RATE_LIMIT=${DESKTOP_OAUTH_POLL_RATE_LIMIT:-180}
      - DESKTOP_OAUTH_POLL_RATE_LIMIT_DURATION=${DESKTOP_OAUTH_POLL_RATE_LIMIT_DURATION:-180}
      # 容器内监听端口。默认 3000，与端口映射的容器侧一致；改动时须同步 NEW_API_PORT_MAPPING。
      - PORT=${PORT:-3000}
      # 前端基础 URL。非空时服务端不再托管前端，改为把页面请求 301 到该地址。
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
      # 主从节点角色。多实例部署时从节点设为 slave。
      - NODE_TYPE=${NODE_TYPE:-master}
      # 运行期调优
      - RELAY_TIMEOUT=${RELAY_TIMEOUT:-0}
      - MEMORY_CACHE_ENABLED=${MEMORY_CACHE_ENABLED:-true}
      - GROUP_MODEL_ROUTE_HELPER_ENABLED=${GROUP_MODEL_ROUTE_HELPER_ENABLED:-true}
      - CHANNEL_UPDATE_FREQUENCY=${CHANNEL_UPDATE_FREQUENCY:-30}
      - BATCH_UPDATE_INTERVAL=${BATCH_UPDATE_INTERVAL:-5}
      - UPDATE_TASK=${UPDATE_TASK:-true}
      - SYNC_FREQUENCY=${SYNC_FREQUENCY:-60}
      - SQL_MAX_OPEN_CONNS=${SQL_MAX_OPEN_CONNS:-1000}
      - SQL_MAX_IDLE_CONNS=${SQL_MAX_IDLE_CONNS:-100}
      - SQL_MAX_LIFETIME=${SQL_MAX_LIFETIME:-60}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-10}
      - STREAM_SCANNER_MAX_BUFFER_MB=${STREAM_SCANNER_MAX_BUFFER_MB:-64}
      - MAX_REQUEST_BODY_MB=${MAX_REQUEST_BODY_MB:-32}
      - MAX_FILE_DOWNLOAD_MB=${MAX_FILE_DOWNLOAD_MB:-64}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-30}
      - TASK_QUERY_LIMIT=${TASK_QUERY_LIMIT:-100}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-10}
      - NOTIFY_LIMIT_COUNT=${NOTIFY_LIMIT_COUNT:-10}
      - NOTIFICATION_LIMIT_DURATION_MINUTE=${NOTIFICATION_LIMIT_DURATION_MINUTE:-5}
      - SUBSCRIPTION_PLAN_CACHE_CAP=${SUBSCRIPTION_PLAN_CACHE_CAP:-100}
      - SUBSCRIPTION_PLAN_CACHE_TTL=${SUBSCRIPTION_PLAN_CACHE_TTL:-300}
      - SUBSCRIPTION_PLAN_INFO_CACHE_CAP=${SUBSCRIPTION_PLAN_INFO_CACHE_CAP:-100}
      - SUBSCRIPTION_PLAN_INFO_CACHE_TTL=${SUBSCRIPTION_PLAN_INFO_CACHE_TTL:-300}
      # 功能开关
      - DEBUG=${DEBUG:-false}
      - ENABLE_PPROF=${ENABLE_PPROF:-false}
      - TLS_INSECURE_SKIP_VERIFY=${TLS_INSECURE_SKIP_VERIFY:-false}
      - GENERATE_DEFAULT_TOKEN=${GENERATE_DEFAULT_TOKEN:-false}
      - GET_MEDIA_TOKEN=${GET_MEDIA_TOKEN:-true}
      - GET_MEDIA_TOKEN_NOT_STREAM=${GET_MEDIA_TOKEN_NOT_STREAM:-false}
      - DIFY_DEBUG=${DIFY_DEBUG:-true}
      - COHERE_SAFETY_SETTING=${COHERE_SAFETY_SETTING:-NONE}
      - GEMINI_SAFETY_SETTING=${GEMINI_SAFETY_SETTING:-}
      - FORCE_STREAM_OPTION=${FORCE_STREAM_OPTION:-true}
      - AZURE_DEFAULT_API_VERSION=${AZURE_DEFAULT_API_VERSION:-}
      - TRUSTED_REDIRECT_DOMAINS=${TRUSTED_REDIRECT_DOMAINS:-}
      - LINUX_DO_TOKEN_ENDPOINT=${LINUX_DO_TOKEN_ENDPOINT:-}
      - LINUX_DO_USER_ENDPOINT=${LINUX_DO_USER_ENDPOINT:-}
      # Pyroscope 持续性能分析
      - PYROSCOPE_URL=${PYROSCOPE_URL:-}
      - PYROSCOPE_APP_NAME=${PYROSCOPE_APP_NAME:-new-api}
      - PYROSCOPE_BASIC_AUTH_USER=${PYROSCOPE_BASIC_AUTH_USER:-}
      - PYROSCOPE_BASIC_AUTH_PASSWORD=${PYROSCOPE_BASIC_AUTH_PASSWORD:-}
      - PYROSCOPE_MUTEX_RATE=${PYROSCOPE_MUTEX_RATE:-5}
      - PYROSCOPE_BLOCK_RATE=${PYROSCOPE_BLOCK_RATE:-5}
      # 反向代理信任。留空（推荐）表示不信任任何转发头（所有客户端按 socket 地址识别，
      # 反代后会塌缩到同一个限流桶，仅在确实没有反向代理时使用）；auto 表示由进程按运行
      # 环境自行判定：两种情况都信任 loopback（同机 nginx/Caddy/Traefik），容器内再额外
      # 信任容器网段（存在安全边界，详见 .env.example:21-27）；也可显式写 IP/CIDR 列表。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # 渠道缓存与健康检查
      - CHANNEL_CACHE_SYNC_ENABLED=${CHANNEL_CACHE_SYNC_ENABLED:-true}
      - CHANNEL_TEST_FREQUENCY=${CHANNEL_TEST_FREQUENCY:-}
      # 独立日志库。留空即日志与主库同库。
      - LOG_SQL_DSN=${LOG_SQL_DSN:-}
      # 上游连接池
      - RELAY_MAX_IDLE_CONNS=${RELAY_MAX_IDLE_CONNS:-500}
      - RELAY_MAX_IDLE_CONNS_PER_HOST=${RELAY_MAX_IDLE_CONNS_PER_HOST:-100}
      # 任务价格补丁（JSON 字符串）
      - TASK_PRICE_PATCH=${TASK_PRICE_PATCH:-}
      - NODE_NAME=${NODE_NAME:-}  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - CHANNEL_ROUTING_V2_ENABLED=${CHANNEL_ROUTING_V2_ENABLED:-false}
      - CHANNEL_ROUTING_SHADOW_ENABLED=${CHANNEL_ROUTING_SHADOW_ENABLED:-false}
      - CHANNEL_ROUTING_V2_STRICT_WRITES=${CHANNEL_ROUTING_V2_STRICT_WRITES:-}
      - CHANNEL_CONCURRENCY_STRICT=${CHANNEL_CONCURRENCY_STRICT:-true}
      - CHANNEL_CONCURRENCY_LEASE_TTL_SECONDS=${CHANNEL_CONCURRENCY_LEASE_TTL_SECONDS:-30}
      - CHANNEL_CONCURRENCY_RESELECT_LIMIT=${CHANNEL_CONCURRENCY_RESELECT_LIMIT:-5}
      # 流模式无响应超时时间，单位秒。代码默认 300（common/init.go 的 GetEnvOrDefault）。
      # 出现空补全时可以调大。
      - STREAMING_TIMEOUT=${STREAMING_TIMEOUT:-300}
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -T 10 -O /dev/null http://127.0.0.1:$${PORT:-3000}/api/healthz"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  redis:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping | grep -Fxq PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -X -q -tA -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' | grep -Fxq 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: ${MYSQL_CONTAINER_NAME:-mysql}
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
