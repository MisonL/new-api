name: Publish Docker image (nightly)

on:
  push:
    branches:
      - nightly
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Determine nightly version
        id: version
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="nightly-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION for ${{ matrix.arch }}"

      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Prepare registry targets
        id: registry
        run: |
          # 原文件硬编码了上游作者的 Docker Hub 命名空间 calciumion/new-api，
          # 与本仓库另外两个 docker workflow 的 ${GITHUB_REPOSITORY} /
          # secrets.DOCKERHUB_USERNAME 口径不一致；推了会往上游仓库写镜像。
          echo "ghcr_repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_repository=${{ secrets.DOCKERHUB_USERNAME }}/new-api" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.registry.outputs.ghcr_repository }}

      # 与 docker-build.yml 同口径：tag 列表在 shell 里拼，Docker Hub 未启用时
      # 不产生空行（空字符串会被 build-push-action 当成非法 tag）。
      - name: Prepare image tags
        id: tags
        run: |
          {
            echo "value<<EOF"
            echo "${{ steps.registry.outputs.ghcr_repository }}:nightly-${{ matrix.arch }}"
            echo "${{ steps.registry.outputs.ghcr_repository }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}"
            if [ "${{ steps.registry.outputs.dockerhub_enabled }}" = "true" ]; then
              echo "${{ steps.registry.outputs.dockerhub_repository }}:nightly-${{ matrix.arch }}"
              echo "${{ steps.registry.outputs.dockerhub_repository }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            EFFECTIVE_APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.version.outputs.source_sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.created }}
            SOURCE_URL=${{ steps.build_meta.outputs.source }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (GHCR + optional Docker Hub)
    needs: [build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Determine nightly version
        id: version
        run: |
          VERSION="nightly-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare registry targets
        id: registry
        run: |
          echo "ghcr_repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_repository=${{ secrets.DOCKERHUB_USERNAME }}/new-api" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (GHCR - nightly)
        run: |
          docker buildx imagetools create \
            -t "${{ steps.registry.outputs.ghcr_repository }}:nightly" \
            "${{ steps.registry.outputs.ghcr_repository }}:nightly-amd64" \
            "${{ steps.registry.outputs.ghcr_repository }}:nightly-arm64"

      - name: Create & push manifest (GHCR - versioned nightly)
        run: |
          docker buildx imagetools create \
            -t "${{ steps.registry.outputs.ghcr_repository }}:${VERSION}" \
            "${{ steps.registry.outputs.ghcr_repository }}:${VERSION}-amd64" \
            "${{ steps.registry.outputs.ghcr_repository }}:${VERSION}-arm64"

      - name: Create & push manifest (Docker Hub - nightly)
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.registry.outputs.dockerhub_repository }}:nightly" \
            "${{ steps.registry.outputs.dockerhub_repository }}:nightly-amd64" \
            "${{ steps.registry.outputs.dockerhub_repository }}:nightly-arm64"

      - name: Create & push manifest (Docker Hub - versioned nightly)
        if: steps.registry.outputs.dockerhub_enabled == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.registry.outputs.dockerhub_repository }}:${VERSION}" \
            "${{ steps.registry.outputs.dockerhub_repository }}:${VERSION}-amd64" \
            "${{ steps.registry.outputs.dockerhub_repository }}:${VERSION}-arm64"
