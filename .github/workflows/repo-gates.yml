name: Repo Gates

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, dev]

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # 与 Dockerfile builder2 的 golang:1.27.4-alpine 保持一致；stdlib
          # 行为随工具链走，CI 与产物的编译器版本不能分叉。
          go-version: '1.27.4'
          cache: true
      # main.go 用 //go:embed 引前端 dist，而 dist 不进仓库。放占位文件即可
      # 让 go build ./... 通过嵌入检查；前端产物本身由 frontend-checks 验证。
      - name: stub embedded frontend dist
        run: |
          mkdir -p web/default/dist web/classic/dist
          printf '<!doctype html><title>stub</title>\n' > web/default/dist/index.html
          printf '<!doctype html><title>stub</title>\n' > web/classic/dist/index.html
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (full suite, nested modules included)
        run: ./scripts/go-test-all.sh -count=1
      # 可达漏洞必须是 0。govulncheck 只报调用链真实可达的漏洞；模块里存在但
      # 未被调用的（如 x/crypto/openpgp）不计入，避免无法修复的项卡住门禁。
      - name: govulncheck
        run: |
          # 钉版本：@latest 会让门禁随上游发版静默漂移（漏洞库仍由 govulncheck
          # 每次联网更新，那是数据不是代码）。
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: install web/default deps
        working-directory: web/default
        run: bun install --frozen-lockfile
      # 运行时依赖零漏洞。--production 排除 devDependencies（braces 3.0.3 无
      # 修复版且只在 shadcn/knip/chokidar 的构建链里，不进产物）。
      - name: web/default audit (production)
        working-directory: web/default
        run: bun audit --production
      - name: web/default format
        working-directory: web/default
        run: bun run format:check
      - name: web/default lint
        working-directory: web/default
        run: bun run lint
      - name: web/default typecheck
        working-directory: web/default
        run: bun run typecheck
      # 单元测试此前只在本地跑：38 个文件、275 个用例（含只读守卫与错误
      # 提示去重的回归）对 CI 不可见，改动破坏了也没人拦。
      - name: web/default unit tests
        working-directory: web/default
        run: bun run test
      - name: web/default build
        working-directory: web/default
        run: bun run build
      - name: install web/classic deps
        working-directory: web/classic
        run: bun install --frozen-lockfile
      - name: web/classic audit (production)
        working-directory: web/classic
        run: bun audit --production
      - name: web/classic format
        working-directory: web/classic
        run: bun run lint
      - name: web/classic eslint
        working-directory: web/classic
        run: bun run eslint
      - name: web/classic build
        working-directory: web/classic
        run: bun run build
      # classic 的单元测试与 web/tests 的 node 契约测试是两套，前者此前
      # 只在本地跑（20 个文件、218 个用例）。
      - name: web/classic unit tests
        working-directory: web/classic
        run: bun test
      - name: web node contract tests
        working-directory: web/classic
        run: bun run test:node
      # audit 读 lockfile，产物可能打包另一份旧副本（§11.1：classic 曾把
      # mermaid 嵌套的 katex@0.16.47 打进 dist，而 audit 显示 0.18.11 已修）。
      # 该检查直接扫两个 dist，要求打包进去的版本与 node_modules 解析一致。
      # 本 job 已 setup-bun，用 bun 跑与 Dockerfile/发布脚本同源。
      - name: verify bundled dependency versions
        run: bun scripts/frontend-bundle-versions.mjs

  relaykit-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # 上游锚点只随上游 tag（v1.0.0-rc.41 等）出现，不在本仓库历史里；
      # 宿主基线也可能只是本地历史。checkout 拿不到它们时 citation 会把
      # 每一条引用都判成 file not found。GitHub 不接受按短 SHA fetch，
      # 因此两个锚点都按发全长的 SHA 取回，SHA 一律由 relaykit-pin.py 给，
      # workflow 不抄第二份（gate-selfcheck 的 check_ci_anchor_fetch 核对）。
      - name: fetch relaykit anchors
        env:
          relaykit_anchor_repository: QuantumNous/new-api
        run: |
          git fetch --no-tags --depth=1 "https://github.com/$relaykit_anchor_repository" \
            "$(git rev-parse $(python3 -I scripts/relaykit-pin.py))"
          git fetch --no-tags --depth=1 origin \
            "$(git rev-parse $(python3 -I scripts/relaykit-pin.py --baseline))"
      # citation-check 的默认 ref 是 upstream/main（fail-closed 设计），CI 中无该
      # remote 且预期漂移，因此显式钉在设计文档声明的锚点上。ref 值经
      # scripts/relaykit-pin.py 从 selfcheck 的 UPSTREAM_PIN 取得，升锚只改一处；
      # gate-selfcheck 的 check_ci_pin 会核对这一行没有分叉。
      - name: relaykit citation check
        run: python3 -I scripts/relaykit-citation-check.py --ref "$(python3 -I scripts/relaykit-pin.py)"
      - name: relaykit c-symbols check
        run: python3 -I scripts/relaykit-c-symbols-check.py
      - name: relaykit gate selfcheck
        run: python3 -I scripts/relaykit-gate-selfcheck.py

  i18n-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # 与 frontend-checks/tauri 同源，避免各 job 各自取 latest。
          bun-version-file: .bun-version
      - name: install web/classic deps
        working-directory: web/classic
        run: bun install --frozen-lockfile
      # 覆盖率检查取代原先的 "extract 幂等性" 步骤。原步骤先跑 extract（把缺失
      # 键写进工作区）再比对两次 extract 的输出，只证明了 extract 幂等：仓库与
      # 代码漂移时永远通过（2026-11-06 实测 7 个语言各缺 11 个键，门禁仍全绿）。
      # 新检查只读，跑 `status <locale>` 判定"代码里用到的键是否都在文件里"。
      - name: i18n coverage gate
        working-directory: web/classic
        run: node ../scripts/i18nCoverageGate.mjs
      - name: i18n lint gate
        working-directory: web/classic
        run: node ../scripts/i18nLintGate.mjs
      # 完成度检查只读，覆盖两个前端：值仍原样等于 en 且形如英文句子的条目、
      # 以及译文占位符与基准不一致的条目。2026-11-08 实测补齐前 classic
      # fr/ru/ja/vi 各 176/175/215/210 条、web/default fr/vi 各 94/91 条。
      - name: i18n translation completeness gate
        working-directory: web
        run: node scripts/i18nTranslationCompletenessGate.mjs
      # web/default 没有提取器，sync-i18n.mjs 只对齐语言文件、从不扫描源码；
      # 2026-11-07 实测 3 个代码在用的键在 6 个语言文件里全部缺失仍无人发现。
      # 该检查只读，扫 t('...') 字面量并校验 static-keys.ts 的登记是否落到 en.json。
      - name: web/default i18n coverage gate
        working-directory: web/default
        run: node ../scripts/i18nDefaultCoverageGate.mjs

  operational-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: compose healthcheck contract
        run: |
          python3 -I scripts/compose-healthcheck-contract.test.py
          python3 -I scripts/compose-healthcheck-contract.py
      - name: dockerfile and compose contract
        run: node --test scripts/dockerfile-contract.test.mjs
      # 只读代理必须与两份前端 guard 阻断同一批 GET 副作用接口，否则 curl 可以
      # 绕过前端直接落到正式后端。
      - name: read-only proxy contract
        run: node --test scripts/readonly-proxy-contract.test.mjs
      # 门禁脚本自身的回归测试：确保"产物版本 == 解析版本"的判据不会被改坏。
      - name: frontend bundle version check contract
        run: node --test scripts/frontend-bundle-versions.test.mjs
