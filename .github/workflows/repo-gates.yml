name: Repo Gates

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, dev]

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # 与 Dockerfile builder2 的 golang:1.27.2-alpine 保持一致；stdlib
          # 行为随工具链走，CI 与产物的编译器版本不能分叉。
          go-version: '1.27.2'
          cache: true
      # main.go 用 //go:embed 引前端 dist，而 dist 不进仓库。放占位文件即可
      # 让 go build ./... 通过嵌入检查；前端产物本身由 frontend-checks 验证。
      - name: stub embedded frontend dist
        run: |
          mkdir -p web/default/dist web/classic/dist
          printf '<!doctype html><title>stub</title>\n' > web/default/dist/index.html
          printf '<!doctype html><title>stub</title>\n' > web/classic/dist/index.html
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (full suite, nested modules included)
        run: ./scripts/go-test-all.sh -count=1

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: install web/default deps
        working-directory: web/default
        run: bun install --frozen-lockfile
      - name: web/default format
        working-directory: web/default
        run: bun run format:check
      - name: web/default lint
        working-directory: web/default
        run: bun run lint
      - name: web/default typecheck
        working-directory: web/default
        run: bun run typecheck
      - name: web/default build
        working-directory: web/default
        run: bun run build
      - name: install web/classic deps
        working-directory: web/classic
        run: bun install --frozen-lockfile
      - name: web/classic format
        working-directory: web/classic
        run: bun run lint
      - name: web/classic eslint
        working-directory: web/classic
        run: bun run eslint
      - name: web node contract tests
        working-directory: web/classic
        run: bun run test:node

  relaykit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # citation-check 的默认 ref 是 upstream/main（fail-closed 设计），CI 中无该
      # remote 且预期漂移，因此显式钉在设计文档声明的锚点上。ref 值经
      # scripts/relaykit-pin.py 从 selfcheck 的 UPSTREAM_PIN 取得，升锚只改一处；
      # gate-selfcheck 的 check_ci_pin 会核对这一行没有分叉。
      - name: relaykit citation check
        run: python3 -I scripts/relaykit-citation-check.py --ref "$(python3 -I scripts/relaykit-pin.py)"
      - name: relaykit c-symbols check
        run: python3 -I scripts/relaykit-c-symbols-check.py
      - name: relaykit gate selfcheck
        run: python3 -I scripts/relaykit-gate-selfcheck.py

  i18n-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # 与 frontend-checks/tauri 同源，避免各 job 各自取 latest。
          bun-version-file: .bun-version
      - name: install web/classic deps
        working-directory: web/classic
        run: bun install --frozen-lockfile
      - name: i18n extract idempotency
        working-directory: web/classic
        run: |
          bun x i18next-cli extract
          cp src/i18n/locales/zh-CN.json /tmp/zh-CN-first.json
          bun x i18next-cli extract
          diff /tmp/zh-CN-first.json src/i18n/locales/zh-CN.json
      - name: i18n lint gate
        working-directory: web/classic
        run: node ../scripts/i18nLintGate.mjs

  operational-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: compose healthcheck contract
        run: |
          python3 -I scripts/compose-healthcheck-contract.test.py
          python3 -I scripts/compose-healthcheck-contract.py
      - name: dockerfile and compose contract
        run: node --test scripts/dockerfile-contract.test.mjs
