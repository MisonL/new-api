name: PR Check

permissions:
  contents: read
  # anti-slop 的失败动作：打标签/评论/锁会话走 issues API（addLabels、
  # createComment、lock），关 PR 走 pulls API（pulls.update）。只读 token 执行
  # 不了这两类操作，而本 workflow 同时启用了 failure-add-pr-labels、
  # failure-pr-message 与 close-pr，因此两类写权限都必须给。
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@5b9bb56579545d24e488e3312108968079ef425c # v0.2.1
        with:
          max-failures: 4
          require-description: false

          # require-linked-issue: false
          require-pr-template: false

          detect-spam-usernames: true
          min-account-age: 30

          failure-add-pr-labels: "pr-check-failed"
          failure-pr-message: "该 PR 未通过基础门禁检查。项目接受 AI 协助开发，但提交人必须核对结果并对后续修复负责。/ This PR did not pass the baseline checks. AI-assisted development is allowed, but the submitter must verify the result and remain responsible for follow-up fixes."
          close-pr: true
