[package]
name = "new-api-tauri-desktop"
version = "1.1.0"
description = "New API desktop shell powered by Tauri 2"
authors = ["MisonL"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/MisonL/new-api"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "new_api_tauri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
getrandom = "0.4.3"
sys-locale = "0.3.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2.5.4"

# SIGTERM/SIGKILL 常量与 kill(2)。只在 Unix 上需要：Windows 没有可移植的
# 优雅终止信号，走插件自身的 TerminateProcess。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
