name: ${DEV_COMPOSE_PROJECT_NAME:-new-api-dev-isolated}

services:
  new-api:
    image: ${DEV_NEW_API_IMAGE:-new-api-local:dev}
    init: true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${DEV_NEW_API_PORT:-3001}:3000"
    volumes:
      - type: bind
        source: ${DEV_NEW_API_DATA_DIR:?set DEV_NEW_API_DATA_DIR}
        target: /data
      - type: bind
        source: ${DEV_NEW_API_LOG_DIR:?set DEV_NEW_API_LOG_DIR}
        target: /app/logs
    environment:
      - SESSION_SECRET=${DEV_SESSION_SECRET:?set DEV_SESSION_SECRET}
      - CRYPTO_SECRET=${DEV_CRYPTO_SECRET:?set DEV_CRYPTO_SECRET}
      - SQL_DSN=${DEV_SQL_DSN:?set DEV_SQL_DSN}
      - REDIS_CONN_STRING=${DEV_REDIS_CONN_STRING:?set DEV_REDIS_CONN_STRING}
      - TZ=${DEV_TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=${DEV_ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${DEV_BATCH_UPDATE_ENABLED:-true}
      # 全局限流阈值（仅环境变量生效，后台设置页无对应选项）。
      # 默认值与正式环境一致，便于在隔离环境复现限流与豁免行为。
      - GLOBAL_API_RATE_LIMIT=${DEV_GLOBAL_API_RATE_LIMIT:-180}
      - GLOBAL_API_RATE_LIMIT_DURATION=${DEV_GLOBAL_API_RATE_LIMIT_DURATION:-180}
      - GLOBAL_WEB_RATE_LIMIT=${DEV_GLOBAL_WEB_RATE_LIMIT:-60}
      - GLOBAL_WEB_RATE_LIMIT_DURATION=${DEV_GLOBAL_WEB_RATE_LIMIT_DURATION:-180}
      # 仅在选项 GlobalRateLimitAdminExemptEnabled 尚不存在时播种；此后以后台开关为准
      - GLOBAL_RATE_LIMIT_ADMIN_EXEMPT=${DEV_GLOBAL_RATE_LIMIT_ADMIN_EXEMPT:-false}
      - GLOBAL_API_RATE_LIMIT_ENABLE=${DEV_GLOBAL_API_RATE_LIMIT_ENABLE:-true}
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=${DEV_GLOBAL_WEB_RATE_LIMIT_ENABLE:-true}
      - CRITICAL_RATE_LIMIT_ENABLE=${DEV_CRITICAL_RATE_LIMIT_ENABLE:-true}
      - SEARCH_RATE_LIMIT_ENABLE=${DEV_SEARCH_RATE_LIMIT_ENABLE:-true}
      - SUGGESTION_RATE_LIMIT_ENABLE=${DEV_SUGGESTION_RATE_LIMIT_ENABLE:-true}
      - CRITICAL_RATE_LIMIT=${DEV_CRITICAL_RATE_LIMIT:-20}
      - CRITICAL_RATE_LIMIT_DURATION=${DEV_CRITICAL_RATE_LIMIT_DURATION:-1200}
      - SEARCH_RATE_LIMIT=${DEV_SEARCH_RATE_LIMIT:-10}
      - SEARCH_RATE_LIMIT_DURATION=${DEV_SEARCH_RATE_LIMIT_DURATION:-60}
      - SUGGESTION_RATE_LIMIT=${DEV_SUGGESTION_RATE_LIMIT:-60}
      - SUGGESTION_RATE_LIMIT_DURATION=${DEV_SUGGESTION_RATE_LIMIT_DURATION:-60}
      - DESKTOP_OAUTH_POLL_RATE_LIMIT_ENABLE=${DEV_DESKTOP_OAUTH_POLL_RATE_LIMIT_ENABLE:-true}
      - DESKTOP_OAUTH_POLL_RATE_LIMIT=${DEV_DESKTOP_OAUTH_POLL_RATE_LIMIT:-180}
      - DESKTOP_OAUTH_POLL_RATE_LIMIT_DURATION=${DEV_DESKTOP_OAUTH_POLL_RATE_LIMIT_DURATION:-180}
      - CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED=${DEV_CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED:-false}
      - CHANNEL_CACHE_SYNC_ENABLED=${DEV_CHANNEL_CACHE_SYNC_ENABLED:-false}
      # Exercise the route-scope selector in the isolated environment by
      # default. Production keeps these flags explicit in its own env file.
      - CHANNEL_ROUTING_V2_ENABLED=${DEV_CHANNEL_ROUTING_V2_ENABLED:-true}
      - CHANNEL_ROUTING_SHADOW_ENABLED=${DEV_CHANNEL_ROUTING_SHADOW_ENABLED:-false}
      - CHANNEL_ROUTING_V2_STRICT_WRITES=${DEV_CHANNEL_ROUTING_V2_STRICT_WRITES:-true}
      - CHANNEL_CONCURRENCY_STRICT=${DEV_CHANNEL_CONCURRENCY_STRICT:-true}
      - UPDATE_TASK=${DEV_UPDATE_TASK:-false}
      - SUBSCRIPTION_QUOTA_RESET_TASK_ENABLED=${DEV_SUBSCRIPTION_QUOTA_RESET_TASK_ENABLED:-false}
      # auto 由进程按运行环境判定：两种环境都信任 loopback，容器内再信任容器网段。
      - TRUSTED_PROXIES=${DEV_TRUSTED_PROXIES-auto}
      - NODE_NAME=${DEV_NODE_NAME:-dev-isolated-node-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dev-isolated-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -T 10 -O /dev/null http://127.0.0.1:$${DEV_NEW_API_PORT:-3000}/api/healthz"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  redis:
    image: redis:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--requirepass", "${DEV_REDIS_PASSWORD:?set DEV_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:?set DEV_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    networks:
      - dev-isolated-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping | grep -Fxq PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?set DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-new-api-dev}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: ${DEV_POSTGRES_DATA_DIR:?set DEV_POSTGRES_DATA_DIR}
        target: /var/lib/postgresql/data
    networks:
      - dev-isolated-network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -X -q -tA -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' | grep -Fxq 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  dev-isolated-network:
    driver: bridge
